name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build · budget
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint CSS
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Dist size budget
        run: npm run budget:dist
        env:
          # After purging dead public trees (~450+ MB); continue toward 250 over time.
          DIST_BUDGET_TOTAL_MB: '750'
          DIST_BUDGET_JS_CSS_MB: '5'

      - name: Production audit (high+)
        run: npm run audit:prod
        continue-on-error: false
