<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shinobi Way</title>
    <!-- Pixel-arcade chrome fonts: Silkscreen (display/buttons) + VT323 (body/stats) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap"
    />
    <!-- Minimal utility classes formerly provided by Tailwind CDN (no runtime CDN in prod). -->
    <style>
      /* Custom scrollbar for game log */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #18181b;
      }
      ::-webkit-scrollbar-thumb {
        background: #3f3f46;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #52525b;
      }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out forwards;
      }
      /* Layout utilities still referenced by App shell / ErrorBoundary */
      .h-screen { height: 100vh; }
      .min-h-0 { min-height: 0; }
      .min-h-\[400px\] { min-height: 400px; }
      .w-full { width: 100%; }
      .w-\[280px\] { width: 280px; }
      .h-full { height: 100%; }
      .max-w-md { max-width: 28rem; }
      .max-w-lg { max-width: 32rem; }
      .max-h-32 { max-height: 8rem; }
      .flex { display: flex; }
      .flex-1 { flex: 1 1 0%; }
      .flex-col { flex-direction: column; }
      .items-center { align-items: center; }
      .justify-center { justify-content: center; }
      .overflow-hidden { overflow: hidden; }
      .overflow-x-hidden { overflow-x: hidden; }
      .overflow-auto { overflow: auto; }
      .relative { position: relative; }
      .hidden { display: none; }
      .p-2 { padding: 0.5rem; }
      .p-4 { padding: 1rem; }
      .p-8 { padding: 2rem; }
      .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
      .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
      .mb-2 { margin-bottom: 0.5rem; }
      .mb-4 { margin-bottom: 1rem; }
      .mt-2 { margin-top: 0.5rem; }
      .text-center { text-align: center; }
      .text-xs { font-size: 0.75rem; line-height: 1rem; }
      .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
      .text-6xl { font-size: 3.75rem; line-height: 1; }
      .font-sans { font-family: ui-sans-serif, system-ui, sans-serif; }
      .font-bold { font-weight: 700; }
      .rounded { border-radius: 0.25rem; }
      .rounded-lg { border-radius: 0.5rem; }
      .border { border-width: 1px; border-style: solid; }
      .border-r { border-right-width: 1px; border-right-style: solid; }
      .border-l { border-left-width: 1px; border-left-style: solid; }
      .border-zinc-900 { border-color: #18181b; }
      .border-red-800\/50 { border-color: rgb(153 27 27 / 0.5); }
      .bg-black { background-color: #000; }
      .bg-zinc-950 { background-color: #09090b; }
      .bg-zinc-900\/90 { background-color: rgb(24 24 27 / 0.9); }
      .bg-black\/50 { background-color: rgb(0 0 0 / 0.5); }
      .bg-cyan-600 { background-color: #0891b2; }
      .text-white { color: #fff; }
      .text-gray-300 { color: #d1d5db; }
      .text-zinc-300 { color: #d4d4d8; }
      .text-zinc-400 { color: #a1a1aa; }
      .text-zinc-500 { color: #71717a; }
      .text-red-400 { color: #f87171; }
      .text-red-500 { color: #ef4444; }
      .hover\:bg-cyan-500:hover { background-color: #06b6d4; }
      .hover\:text-zinc-300:hover { color: #d4d4d8; }
      .cursor-pointer { cursor: pointer; }
      .transition-colors { transition-property: color, background-color, border-color; transition-duration: 150ms; }
      @media (min-width: 1024px) {
        .lg\:flex { display: flex; }
      }
    </style>
</head>
  <body class="bg-black text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
